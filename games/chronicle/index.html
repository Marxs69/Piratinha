<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grand Chronicle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="cv"></canvas>
<div id="fbicons"></div>

<!-- Menu inicial -->
<section id="menu" class="screen on">
  <div class="mbox">
    <div id="mflags" class="mflags"></div>
    <h1>Grand Chronicle</h1>
    <div class="mbtns"><button id="m-cont" class="btn big" hidden>▶ Continuar</button><button id="m-new" class="btn big">⚜ Nova crônica</button><button id="m-join" class="btn big">🌐 Entrar numa sala</button></div>
  </div>
</section>

<!-- Escolha do mundo e da nação -->
<section id="setup" class="screen">
  <header class="bar"><button id="s-back" class="btn">← Voltar</button><label class="seed">Semente <input id="s-seed" maxlength="9" spellcheck="false"></label><label class="seed">Início <select id="s-era"><option value="860">860 · Alta Idade Média</option><option value="1100">1100 · Idade Média</option><option value="1453">1453 · Renascimento</option><option value="1680">1680 · Era Moderna</option><option value="1789">1789 · Era das Revoluções</option><option value="1900">1900 · Era Industrial</option></select></label><button id="s-gen" class="btn">🎲 Novo mundo</button><span class="grow"></span><nav class="modes" id="s-modes"></nav></header>
  <aside id="s-card" class="panel"></aside>
  <div id="s-load" class="loading" hidden><b>Gerando o mundo…</b></div>
</section>

<!-- Jogo -->
<section id="game" class="screen">
  <header id="top" class="bar"></header>
  <aside id="side" class="panel" hidden></aside>
  <aside id="side2" class="panel" hidden></aside>
  <aside id="outl" class="panel"></aside>
  <nav id="lnav"></nav>
  <div id="mapbox" class="panel"><div id="chron" hidden></div><div id="enact" hidden></div><button id="chronbar" class="btn"></button><canvas id="mini" width="256" height="144"></canvas><nav id="modes" class="modes"></nav></div>
  <div id="ctx" class="panel" hidden></div>
  <div id="room" class="panel" hidden></div>
  <div id="armybar" hidden></div>
  <div id="win" class="panel" hidden><header><b id="win-t"></b><button id="win-x" class="btn x">✕</button></header><div id="win-b"></div></div>
</section>
<div id="modal" hidden><div id="modal-b" class="panel"></div></div>
<div id="hint" hidden></div>

<div id="tip" hidden></div>
<div id="wm">build 0.2.5 · Governos (MP 0.2)</div>

<script src="content/defines.js"></script>
<script src="content/economy.js"></script>
<script src="content/techs.js"></script>

<script src="engine.js"></script>

<script src="sim/chars.js"></script>

<script src="sim/economy.js"></script>
<script src="sim/space.js"></script>
<script src="sim/war.js"></script>
